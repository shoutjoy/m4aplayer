<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>시간별 음향 분석</title>
<link rel="stylesheet" href="../src/style.css">
<style>body{display:block;padding:0;overflow:auto;background:#0b1622;color:#d5e6f7} .analysis-startup{margin:32px;padding:28px;border:1px solid #2d648a;border-radius:14px;font:16px system-ui;line-height:1.8} .analysis-startup progress{display:block;width:100%;margin:20px 0} .acoustics-window{position:static;width:100%;max-width:none;max-height:none;height:auto;box-sizing:border-box;margin:0;border:0;border-radius:0}.analysis-actions,#tempoBpm,#status{display:none}</style>
</head><body data-analysis-window>
<section class="analysis-startup" id="analysisStartup" role="status" aria-live="polite"><h1>시간별 음향 분석</h1><strong id="analysisStartupStage">분석 창을 준비하고 있습니다…</strong><progress aria-label="분석 창 준비"></progress><p id="analysisStartupDetail">결과 데이터를 연결하는 중입니다. 잠시 기다려 주세요.</p><button id="analysisRetry" type="button" onclick="location.reload()" hidden>다시 불러오기</button></section>
<div class="analysis-actions"></div><output id="tempoBpm"></output><span id="status"></span>
<script>
const fixtureKey='jjaimsae-analysis-00000000-0000-4000-8000-000000000000';
window.__TAURI__={window:{getCurrentWindow:()=>({label:'analysis-00000000-0000-4000-8000-000000000000'})},core:{invoke:async()=>null}};
let fixtureData={points:[],path:'test-tone.wav',lyrics:{cues:[],delay:0},progress:{stage:'acoustics',message:'Pitch · 포먼트 · 음성 지표 계산 중',percent:55,detail:'110/200 구간 · 55.0 / 100.0초 처리',elapsedMs:3000}};
localStorage.setItem(fixtureKey,JSON.stringify(fixtureData));
function updateFixture(stage){fixtureData.progress={stage,message:stage==='complete'?'분석 완료':'분석 실패',percent:stage==='complete'?100:55,detail:stage==='complete'?'200개 구간 처리 완료':'테스트: 오디오 디코딩 실패'};if(stage==='complete')fixtureData.points=Array.from({length:200},(_,i)=>({time:i*.5,pitchMean:200,jitter:Math.sin(i/10)+2,db:-12,autocorrelation:.9}));const raw=JSON.stringify(fixtureData);localStorage.setItem(fixtureKey,raw);window.dispatchEvent(new StorageEvent('storage',{key:fixtureKey,newValue:raw}))}
</script><div style="padding:10px"><button onclick="updateFixture('complete')">테스트: 분석 완료</button> <button onclick="updateFixture('error')">테스트: 분석 오류</button></div><script src="../src/analysis-window.js"></script><script src="../src/acoustics-view.js"></script>
</body></html>
