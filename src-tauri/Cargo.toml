[package]
name = "jjaimsae-player"
version = "2.0.2"
edition = "2021"

[lib]
name = "jjaimsae_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"

tauri-plugin-single-instance = "2"

reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
